version: "3.8"

services:
  ai-data-analyst:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
      - ./sample_data:/app/sample_data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ai-data-analyst-dev:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
      - "5173:5173"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
      - ./sample_data:/app/sample_data
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    command: >
      sh -c "cd /app/frontend &&
      npm run dev -- --host 0.0.0.0 --port 5173 &
      uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    profiles:
      - dev
    restart: unless-stopped